name: Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3

      - name: Build G6 Brain component
        run: |
          idf.py set-target esp32s3
          idf.py build

      - name: Run Unity self-tests
        run: |
          idf.py test
        continue-on-error: true   # Keep during beta2 while expanding test coverage
