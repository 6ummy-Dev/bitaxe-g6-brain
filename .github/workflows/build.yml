name: Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup ESP-IDF v5.3
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3

      - name: Prepare minimal test project
        run: |
          mkdir -p test_app/main test_app/components/g6_brain

          cat > test_app/CMakeLists.txt << 'EOF'
          cmake_minimum_required(VERSION 3.16)
          include($ENV{IDF_PATH}/tools/cmake/project.cmake)
          project(test_g6_brain)
          EOF

          echo 'idf_component_register()' > test_app/main/CMakeLists.txt
          cp -r components/g6_brain test_app/components/

      - name: Build component
        working-directory: test_app
        run: |
          idf.py set-target esp32s3
          idf.py build

      - name: Run tests
        working-directory: test_app
        run: idf.py test
