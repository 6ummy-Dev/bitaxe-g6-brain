name: Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Prepare test application
        run: |
          mkdir -p test_app/main test_app/components/g6_brain

          cat > test_app/CMakeLists.txt << 'EOF'
          cmake_minimum_required(VERSION 3.16)
          include($ENV{IDF_PATH}/tools/cmake/project.cmake)
          project(test_g6_brain)
          EOF

          cat > test_app/main/CMakeLists.txt << 'EOF'
          idf_component_register(
              SRCS 
                  "main.c"
                  "../../components/g6_brain/test/test_g6_brain.c"
              INCLUDE_DIRS 
                  "../../components/g6_brain"
              REQUIRES 
                  g6_brain 
                  unity 
                  nvs_flash
          )
          EOF

          # Copy the brain component (without its own test folder to avoid duplication)
          cp -r components/g6_brain test_app/components/
          rm -rf test_app/components/g6_brain/test

          cat > test_app/main/main.c << 'EOF'
          #include "unity.h"
          #include "esp_log.h"

          static const char *TAG = "G6_TEST";

          void app_main(void)
          {
              ESP_LOGI(TAG, "=== G6 Brain Test Suite ===");

              UNITY_BEGIN();

              // This will run all TEST_CASE functions compiled into the binary
              unity_run_all_tests();

              int failures = UNITY_END();
              if (failures > 0) {
                  ESP_LOGE(TAG, "%d test(s) failed", failures);
              } else {
                  ESP_LOGI(TAG, "All tests passed");
              }
          }
          EOF

      - name: Build test application (ESP32-S3)
        run: |
          docker run --rm \
            -v "$PWD:/project" \
            -w /project/test_app \
            espressif/idf:v5.3 \
            bash -c "
              idf.py set-target esp32s3 &&
              idf.py build
            "

      - name: Verify
        run: echo "✅ Build + Unity tests compiled and linked successfully"
