name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Prepare minimal test project
        run: |
          mkdir -p test_app/main test_app/components/g6_brain

          cat > test_app/CMakeLists.txt << 'EOT'
          cmake_minimum_required(VERSION 3.16)
          include($ENV{IDF_PATH}/tools/cmake/project.cmake)
          project(test_g6_brain)
          EOT

          # Route the unity test suite files directly into the build check targets with nvs_flash requirements
          cat > test_app/main/CMakeLists.txt << 'EOT'
          idf_component_register(
              SRCS "main.c" "../components/g6_brain/test/test_g6_brain.c"
              REQUIRES g6_brain unity nvs_flash
          )
          EOT

          cat > test_app/main/main.c << 'EOT'
          #include "unity.h"
          void app_main(void) {
              UNITY_BEGIN();
              UNITY_END();
          }
          EOT

          cp -r components/g6_brain test_app/components/

      - name: Compile G6 Brain & Test Suite (ESP32-S3 Verification)
        run: |
          docker run --rm \
            -v "$PWD:/project" \
            -w /project/test_app \
            espressif/idf:v5.3 \
            bash -c "idf.py set-target esp32s3 && idf.py build"

      - name: Build & Verification Complete
        run: echo "✅ Both core engine and test suite compiled successfully."
