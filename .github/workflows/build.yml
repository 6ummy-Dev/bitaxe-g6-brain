name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Prepare minimal test project
        run: |
          mkdir -p test_app/main test_app/components/g6_brain

          cat > test_app/CMakeLists.txt << 'EOT'
          cmake_minimum_required(VERSION 3.16)
          include($ENV{IDF_PATH}/tools/cmake/project.cmake)
          project(test_g6_brain)
          EOT

          cat > test_app/main/CMakeLists.txt << 'EOT'
          idf_component_register(SRCS "main.c")
          EOT

          cat > test_app/main/main.c << 'EOT'
          void app_main(void) {}
          EOT

          cp -r components/g6_brain test_app/components/

      - name: Build G6 Brain (ESP32-S3)
        run: |
          docker run --rm \
            -v "$PWD:/project" \
            -w /project/test_app \
            espressif/idf:v5.3 \
            bash -c "idf.py set-target esp32s3 && idf.py build"

      - name: Run Unity Tests
        run: |
          docker run --rm \
            -v "$PWD:/project" \
            -w /project/test_app \
            espressif/idf:v5.3 \
            bash -c "
              idf.py set-target esp32s3 &&
              idf.py build &&
              idf.py test
            "
        # Note: This step will now fail the build if tests fail.
        # The previous '|| echo' was swallowing failures (HOUSE-2 from QA).
        # If the test target is not yet fully configured, this may fail intentionally
        # until the Unity test app setup is complete.

      - name: Build & Test Complete
        run: echo "✅ Build completed successfully"
