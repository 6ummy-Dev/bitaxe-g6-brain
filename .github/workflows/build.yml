name: Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & Test G6 Brain
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup ESP-IDF v5.3
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3
          command: 'true'

      - name: Prepare minimal test project
        run: |
          mkdir -p test_app/main test_app/components/g6_brain

          cat > test_app/CMakeLists.txt << 'EOF'
          cmake_minimum_required(VERSION 3.16)
          include($ENV{IDF_PATH}/tools/cmake/project.cmake)
          project(test_g6_brain)
          EOF

          cat > test_app/main/CMakeLists.txt << 'EOF'
          idf_component_register(SRCS "main.c")
          EOF

          cat > test_app/main/main.c << 'EOF'
          void app_main(void) {}
          EOF

          cp -r components/g6_brain test_app/components/

      - name: Build G6 Brain (ESP32-S3)
        working-directory: test_app
        run: |
          idf.py set-target esp32s3
          idf.py build

      - name: Run Unity tests
        working-directory: test_app
        run: idf.py test
