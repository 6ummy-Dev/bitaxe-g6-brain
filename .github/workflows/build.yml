name: Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Prepare test application
        run: |
          mkdir -p test_app/main test_app/components/g6_brain

          cat > test_app/CMakeLists.txt << 'EOF'
          cmake_minimum_required(VERSION 3.16)
          include($ENV{IDF_PATH}/tools/cmake/project.cmake)
          project(test_g6_brain)
          EOF

          cat > test_app/main/CMakeLists.txt << 'EOF'
          idf_component_register(
              SRCS "main.c"
              REQUIRES g6_brain unity nvs_flash
          )
          EOF

          # Copy the brain component
          cp -r components/g6_brain test_app/components/

          # Create a proper test runner
          cat > test_app/main/main.c << 'EOF'
          #include "unity.h"
          #include "esp_log.h"

          static const char *TAG = "TEST_RUNNER";

          // Unity will automatically find TEST_CASE functions when using
          // unity_run_all_tests() if they are properly linked.
          void app_main(void)
          {
              ESP_LOGI(TAG, "Starting G6 Brain test suite...");

              UNITY_BEGIN();

              // Run all registered Unity tests
              unity_run_all_tests();

              UNITY_END();
          }
          EOF

      - name: Build with tests (ESP32-S3)
        run: |
          docker run --rm \
            -v "$PWD:/project" \
            -w /project/test_app \
            espressif/idf:v5.3 \
            bash -c "
              idf.py set-target esp32s3 &&
              idf.py build
            "

      - name: Success
        run: echo "✅ Build + Test compilation successful"
