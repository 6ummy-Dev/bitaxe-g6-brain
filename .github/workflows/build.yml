name: Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Prepare minimal test project
        run: |
          mkdir -p test_app/main test_app/components/g6_brain

          cat > test_app/CMakeLists.txt << 'EOF'
          cmake_minimum_required(VERSION 3.16)
          include($ENV{IDF_PATH}/tools/cmake/project.cmake)
          project(test_g6_brain)
          EOF

          cat > test_app/main/CMakeLists.txt << 'EOF'
          idf_component_register(SRCS "main.c")
          EOF

          cat > test_app/main/main.c << 'EOF'
          void app_main(void) {}
          EOF

          cp -r components/g6_brain test_app/components/

      - name: Build (ESP32-S3)
        run: |
          docker run --rm \
            -v "$PWD:/project" \
            -w /project/test_app \
            espressif/idf:v5.3 \
            bash -c "idf.py set-target esp32s3 && idf.py build"

      - name: Run tests
        run: |
          docker run --rm \
            -v "$PWD:/project" \
            -w /project/test_app \
            espressif/idf:v5.3 \
            idf.py test
