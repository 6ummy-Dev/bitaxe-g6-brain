name: Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Prepare test app
        run: |
          mkdir -p test_app/main test_app/components/g6_brain

          cat > test_app/CMakeLists.txt << 'EOT'
          cmake_minimum_required(VERSION 3.16)
          include($ENV{IDF_PATH}/tools/cmake/project.cmake)
          project(test_g6_brain)
          EOT

          cat > test_app/main/CMakeLists.txt << 'EOT'
          idf_component_register(
              SRCS "main.c"
              REQUIRES g6_brain unity nvs_flash
          )
          EOT

          cat > test_app/main/main.c << 'EOT'
          #include "unity.h"

          extern void test_g6_brain_init(void);
          extern void test_g6_brain_update(void);
          // Add more test functions here as needed

          void app_main(void) {
              UNITY_BEGIN();

              // Run registered Unity tests
              unity_run_all_tests();

              UNITY_END();
          }
          EOT

          cp -r components/g6_brain test_app/components/

      - name: Build + Run Tests (ESP32-S3)
        run: |
          docker run --rm \
            -v "$PWD:/project" \
            -w /project/test_app \
            espressif/idf:v5.3 \
            bash -c "
              idf.py set-target esp32s3 &&
              idf.py build
            "

      - name: Verify
        run: echo "✅ Build + Unity tests compiled successfully"
